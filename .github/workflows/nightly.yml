name: Nightly Podcast

on:
  schedule:
    # GitHub Actions cron is always UTC and does not shift for daylight
    # saving, so a single fixed line would be off by an hour for half the
    # year. Two triggers cover both UTC offsets Pacific Time uses; the guard
    # step below skips whichever one runs when today's episode already
    # exists, so only one of them actually does anything each day.
    #
    # Both are offset a few minutes past the hour deliberately — GitHub's own
    # docs warn that schedules firing exactly on the hour queue behind
    # everyone else's, causing multi-hour delays. Observed delay on this repo
    # has been ~2.5-3 hours even off-the-hour, so this targets 5am Pacific
    # rather than 7am, to actually land close to 7am once delayed.
    - cron: "13 13 * * *" # ~5am PST (UTC-8) — standard time, roughly Nov-Mar
    - cron: "13 12 * * *" # ~5am PDT (UTC-7) — daylight time, roughly Mar-Nov
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab to test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's episode already ran
        id: guard
        run: |
          TODAY_SCRIPT="state/scripts/$(date -u +%Y-%m-%d).txt"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f "$TODAY_SCRIPT" ]; then
            echo "$TODAY_SCRIPT already exists — today's episode was already generated"
            echo "by the other seasonal trigger or a manual run. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        if: steps.guard.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate tonight's episode
        if: steps.guard.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.pipeline

      - name: Commit and push new episode
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "autopodcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ state/
          git diff --cached --quiet || git commit -m "Nightly episode: $(date -u +%Y-%m-%d)"
          # A plain push can be rejected if main moved (e.g. a manual push
          # landed while this job was generating the episode). Rebase onto
          # whatever's current and retry a few times before giving up —
          # this job's changes (docs/, state/) essentially never overlap
          # with a human edit's (src/, config/), so this should be conflict-free.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — fetching and rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

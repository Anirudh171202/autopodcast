# Topics and standing instructions for the nightly podcast.
# Edit this file any time you want — the next run picks it up automatically,
# no code changes needed.

topics:
  - Skip computer systems entirely unless there's something genuinely new and exciting from the last day. When there is, go deep on the technical details — I'm a systems software engineer, so don't hold back.
  - For Hacker News, search the current front page for a deep dive or niche story a systems engineer who's already caught up on mainstream tech news would enjoy. Small or niche sub-fields are fine as long as they're genuinely interesting.
  - For sports, Premier League games only, for Liverpool, Manchester United, Manchester City, Tottenham Hotspur, Arsenal, Chelsea, and Aston Villa — plus any Formula 1 race. For tennis, basketball, or cricket, only if there's a major or highly anticipated match; if so, a quick two-to-three-sentence summary of the result is enough.
  - Only cover world news if it's genuinely major — skip this topic entirely otherwise.
  - One brief sentence on the Bay Area weather forecast today.

# Free-text guidance the research step will follow. Add/remove lines freely.
instructions: |
  Only include events, releases, or developments from the last 24 hours — no rehashed trend pieces or "here's what's been happening" roundups.
  I'd rather hear a handful of genuinely interesting stories in real depth than a broad summary of many — skip anything you'd only be able to cover thinly.
  When you go deep on something, explain why it matters or how it works, not just what was announced.
  For the Hacker News topic specifically, prefer something novel or niche over a broad industry narrative another topic might already cover.

# Target runtime in minutes. The script step will scale this down honestly
# on a slow news day rather than pad filler to hit it.
target_minutes: 10

# How many days back to look when deciding what's "already covered" so the
# show doesn't repeat itself night to night.
lookback_days: 5

# How many days an episode stays live in the RSS feed / docs/episodes/ before
# the pipeline deletes it. Keeps the git repo from growing forever.
episode_retention_days: 21

# Base URL where docs/ is served once GitHub Pages is enabled, e.g.
# https://yourusername.github.io/autopodcast
# Used to build absolute enclosure URLs in the RSS feed. Fill this in after
# you create the GitHub repo and turn on Pages (see README).
feed_base_url: "https://anirudh171202.github.io/autopodcast"

podcast_title: "Daily Briefing"
podcast_description: "An automatically researched and narrated daily briefing, generated overnight."

# Topics and standing instructions for the nightly podcast.
# Edit this file any time you want — the next run picks it up automatically,
# no code changes needed.

topics:
  - Anything new and exciting in the computer systems field in the last day. If so, I'm interested in the nerdy details. I'm a systems software engineer so don't skimp. If not, skip entirely. Please skip generic talk.
  - Any exciting or interesting deep dives or tech news that you think me (systems engineer who's pretty much caught up with the field) might enjoy from ycombinator hackernews feed right now. Small niche topics in any sub field is okay, as long as its interesting.
  - The sports I'm interested are (Liverpool, Man U, Man City, Tot Hotspur, Arsenal, Chelsea, Aston Villa) ONLY premier league games, any Formula 1 race. (Tennis, Basketball, Cricket) only if there's a major/highly aanticipated game going on.  if so a quick 2-3 sentence summary of the game and how it went. 
  - If there is time, anything major world news. ONLY if there is any major world news. 
  - 1 brief sentence on the weather in the bay area today.

# Free-text guidance the research step will follow. Add/remove lines freely.
instructions: |
  In any of the topics that you're researching, I ONLY want news if it is based on events/releases in the last 24 hours. My style isn't summaries but I like to listen to a few topics but in great detail (if the topic is interesting ofc).

# Target runtime in minutes. The script step will scale this down honestly
# on a slow news day rather than pad filler to hit it.
target_minutes: 2

# How many days back to look when deciding what's "already covered" so the
# show doesn't repeat itself night to night.
lookback_days: 5

# How many days an episode stays live in the RSS feed / docs/episodes/ before
# the pipeline deletes it. Keeps the git repo from growing forever.
episode_retention_days: 21

# Base URL where docs/ is served once GitHub Pages is enabled, e.g.
# https://yourusername.github.io/autopodcast
# Used to build absolute enclosure URLs in the RSS feed. Fill this in after
# you create the GitHub repo and turn on Pages (see README).
feed_base_url: "https://YOUR-GITHUB-USERNAME.github.io/autopodcast"

podcast_title: "Daily Briefing"
podcast_description: "An automatically researched and narrated daily briefing, generated overnight."
